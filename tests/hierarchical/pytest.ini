[pytest]
# Pytest configuration for hierarchical agent pipeline tests

# Asyncio mode for async tests
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

# Markers
markers =
    integration: mark test as integration test (requires full setup)
    slow: mark test as slow running (may take >10 seconds)
    gpu: mark test as requiring GPU resources
    hierarchical: mark test as testing hierarchical agent flow

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = -v --tb=short

# Minimum version
minversion = 7.0
